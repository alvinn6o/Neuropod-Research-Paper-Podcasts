name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Runs the same suite against both storage backends. The SQLite shim maps
    # vector(1536) to TEXT and strips the HNSW index, so it silently accepts
    # embeddings that real pgvector rejects — every bug at that boundary is
    # invisible when only the shim is exercised.
    name: backend (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: neuropod
          POSTGRES_USER: neuropod
          POSTGRES_PASSWORD: neuropod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuropod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          NEUROPOD_AUTH_MODE: stub
          # Empty for the sqlite leg; a real URL for the postgres leg.
          NEUROPOD_DATABASE_URL: ${{ matrix.backend == 'postgres' && 'postgres://neuropod:neuropod@localhost:5432/neuropod' || '' }}
        run: pytest tests/ -v --tb=short

  retrieval-benchmark:
    # Retrieval metrics printed into the job summary on every PR, so a
    # regression is visible in the diff rather than found later.
    name: retrieval ablation + gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Retrieval ablation + regression gate
        env:
          NEUROPOD_AUTH_MODE: stub
        run: |
          {
            echo '### Retrieval ablation (42-paper frozen corpus, 472 ICT queries)'
            echo '```'
            python -m eval.harness 2>&1 | sed -n '/^Corpus:/,$p'
            echo '```'
            echo '### Regression gate'
            echo '```'
            pytest tests/test_eval_harness.py -q -s --no-header -k regressed 2>&1 | sed -n '/nDCG@10/,$p'
            echo '```'
            echo '### Legacy single-paper fixture (kept for continuity)'
            echo '```'
            pytest tests/test_recall.py -q -s --no-header 2>&1 | sed -n '/recall@/,$p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the build on retrieval regression
        env:
          NEUROPOD_AUTH_MODE: stub
        run: pytest tests/test_eval_harness.py -q -k regressed

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm run build

  docker:
    name: docker (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: neuropod-api:ci
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: false
          tags: neuropod-worker:ci

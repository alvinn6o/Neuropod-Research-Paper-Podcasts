services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: neuropod
      POSTGRES_USER: neuropod
      POSTGRES_PASSWORD: neuropod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuropod"]
      interval: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      NEUROPOD_DATABASE_URL: postgres://neuropod:neuropod@postgres:5432/neuropod
      NEUROPOD_BASE_URL: http://localhost:8000
      NEUROPOD_FRONTEND_URL: http://localhost:3000
      NEUROPOD_AUTH_MODE: stub
      NEUROPOD_AUDIO_BACKEND: disk
      NEUROPOD_GENERATE_AUDIO_ON_PIPELINE: "false"
      ENABLE_SCHEDULER: "false"
      NEUROPOD_CORS_ORIGINS: http://localhost:3000
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./:/app
    depends_on:
      - api

volumes:
  pgdata:
